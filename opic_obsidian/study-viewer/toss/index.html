<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <title>TOEIC Speaking Practice</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="toss-shell">
      <header class="app-header">
        <div class="header-primary">
          <nav class="exam-switch" aria-label="시험 선택">
            <a href="../compact.html" title="오픽 학습">오픽</a>
            <a class="is-active" href="./index.html" aria-current="page" title="토익스피킹 학습">토스</a>
          </nav>
          <p id="appStats" class="app-stats">불러오는 중...</p>
        </div>

        <div class="header-actions">
          <button id="toggleTranslationsBtn" class="secondary-button" type="button" aria-pressed="true">
            번역 숨기기
          </button>
          <button
            id="settingsToggleBtn"
            class="secondary-button icon-button"
            type="button"
            aria-label="음성 설정"
            aria-controls="settingsPanel"
            aria-expanded="false"
            title="음성 설정"
          >⚙</button>
        </div>

        <section id="settingsPanel" class="settings-panel" aria-label="음성 설정" hidden>
          <label class="setting-control">
            <span>속도 <output id="rateValue">0.90x</output></span>
            <input id="rateInput" type="range" min="0.6" max="1.3" step="0.05" value="0.9" />
          </label>
          <label class="setting-control">
            <span>음량 <output id="volumeValue">100%</output></span>
            <input id="volumeInput" type="range" min="0" max="1" step="0.05" value="1" />
          </label>
          <label class="setting-control setting-voice">
            <span>영어 음성</span>
            <select id="voiceSelect"></select>
          </label>
        </section>
      </header>

      <section id="studyNav" class="study-nav">
        <div id="partTabs" class="part-tabs" role="tablist" aria-label="토익스피킹 파트"></div>
        <div class="view-tabs" role="tablist" aria-label="학습 방식">
          <button type="button" role="tab" data-view="list" aria-selected="true">전체 문장</button>
          <button type="button" role="tab" data-view="memorize" aria-selected="false">암기 카드</button>
          <button id="referenceTabBtn" type="button" role="tab" data-view="reference" aria-selected="false">참고 표현</button>
          <button id="strategyTabBtn" type="button" role="tab" data-view="strategy" aria-selected="false">시험 전략</button>
        </div>
      </section>

      <section id="filterBar" class="filter-bar">
        <label class="search-field">
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="영어·한국어·분류 검색" autocomplete="off" />
        </label>
        <label class="section-filter">
          <span>분류</span>
          <select id="sectionSelect"></select>
        </label>
        <p id="resultCount" class="result-count"></p>
        <button id="randomBtn" class="secondary-button" type="button">무작위</button>
      </section>

      <section class="content-area">
        <section id="listView" class="list-view" aria-live="polite">
          <div id="sentenceGrid" class="sentence-grid"></div>
          <p id="emptyState" class="empty-state" hidden>검색 결과가 없습니다.</p>
        </section>

        <section id="memorizeView" class="memorize-view" hidden>
          <article id="memoryCard" class="memory-card">
            <header class="memory-header">
              <div>
                <span id="memoryNumber" class="entry-number"></span>
                <strong id="memoryLabel"></strong>
              </div>
              <span id="memorySection" class="section-name"></span>
            </header>
            <div id="memoryEnglish" class="memory-english" role="button" tabindex="0" aria-label="영어 문장 듣기"></div>
            <div id="memoryKorean" class="memory-korean"></div>
            <footer class="memory-actions">
              <button id="previousBtn" class="secondary-button icon-step" type="button" aria-label="이전 문장" title="이전 문장">←</button>
              <button id="playMemoryBtn" class="primary-button" type="button">▶ 듣기</button>
              <button id="randomMemoryBtn" class="secondary-button" type="button">무작위</button>
              <button id="nextBtn" class="secondary-button icon-step" type="button" aria-label="다음 문장" title="다음 문장">→</button>
            </footer>
            <div class="memory-progress" aria-hidden="true"><i id="memoryProgress"></i></div>
            <p id="memoryPosition" class="memory-position"></p>
          </article>
        </section>

        <section id="referenceView" class="reference-view" hidden>
          <div id="referenceSets" class="reference-grid"></div>
          <article id="comparisonCard" class="comparison-card"></article>
        </section>

        <section id="strategyView" class="strategy-view" hidden>
          <nav class="strategy-section-nav" aria-label="시험 전략 구역">
            <div class="strategy-nav-groups">
              <div id="strategyGuideTabs" class="strategy-guide-tabs" role="tablist" aria-label="전략 자료"></div>
              <div id="strategyTabs" class="strategy-tabs" role="tablist" aria-label="전략 세부 구역"></div>
            </div>
          </nav>
          <article id="strategyContent" class="strategy-content" aria-live="polite"></article>
        </section>
      </section>
    </main>

    <div id="statusToast" class="status-toast" role="status" aria-live="polite" hidden></div>

    <script>
      (() => {
        const requestedVersion = new URLSearchParams(window.location.search).get("v");
        const assetVersion =
          window.location.protocol === "file:" ? "" : requestedVersion || String(Date.now());
        const suffix = assetVersion ? `?v=${encodeURIComponent(assetVersion)}` : "";
        const dataScript = document.createElement("script");
        dataScript.src = `./data.js${suffix}`;
        dataScript.addEventListener("load", () => {
          const appScript = document.createElement("script");
          appScript.src = `./app.js${suffix}`;
          document.body.append(appScript);
        }, { once: true });
        document.body.append(dataScript);
      })();
    </script>
  </body>
</html>
